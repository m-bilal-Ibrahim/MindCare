version: "3.9"

# Local development only. Production uses Supabase/Neon (Postgres) and
# Redis Cloud — see docs/deployment.md — not these containers.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mindcare
      POSTGRES_PASSWORD: mindcare
      POSTGRES_DB: mindcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:

version: 2
updates:
  # Backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/MindCare Backend/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"

  # Keep the GitHub Actions themselves up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  # Add entries for Web (npm) and App (pub) here once those branches
  # are merged in — same file, new blocks, don't create a second one.
